services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-16-alpine}
    container_name: sales_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - sales_agent_net
    # Port 5432 is strictly internal to sales_agent_net; not exposed to the host machine.

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:-2.44.6}
    container_name: sales_agent_n8n
    restart: unless-stopped
    ports:
      # Bound explicitly to 127.0.0.1 for secure local access
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      # Database connection
      - DB_TYPE=${DB_TYPE:-postgresdb}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}

      # Core and encryption
      - N8N_HOST=${N8N_HOST:-127.0.0.1}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://127.0.0.1:5678/}
      - N8N_WEBHOOK_URL=${WEBHOOK_URL:-http://127.0.0.1:5678/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # Timezone configuration
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Manila}
      - TZ=${TZ:-Asia/Manila}

      # Execution retention & pruning
      - EXECUTIONS_DATA_PRUNE=${EXECUTIONS_DATA_PRUNE:-true}
      - EXECUTIONS_DATA_MAX_AGE=${EXECUTIONS_DATA_MAX_AGE:-168}
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-50000}
      - EXECUTIONS_DATA_SAVE_ON_ERROR=${EXECUTIONS_DATA_SAVE_ON_ERROR:-all}
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=${EXECUTIONS_DATA_SAVE_ON_SUCCESS:-all}
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=${EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS:-true}

      # Telegram Business Configuration
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - TELEGRAM_SELLER_USER_ID=${TELEGRAM_SELLER_USER_ID}
      - TELEGRAM_TEST_MODE=${TELEGRAM_TEST_MODE:-false}
      - TELEGRAM_ALLOWED_TEST_CHAT_IDS=${TELEGRAM_ALLOWED_TEST_CHAT_IDS}

      # Gemini AI Configuration
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sales_agent_net

  webhook_proxy:
    image: nginx:alpine
    container_name: sales_agent_webhook_proxy
    restart: unless-stopped
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - sales_agent_net
    depends_on:
      - n8n

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sales_agent_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://webhook_proxy:80
    networks:
      - sales_agent_net
    depends_on:
      - webhook_proxy

networks:
  sales_agent_net:
    name: sales_agent_net
    driver: bridge

volumes:
  postgres_data:
    name: sales_agent_postgres_data
  n8n_data:
    name: sales_agent_n8n_data
