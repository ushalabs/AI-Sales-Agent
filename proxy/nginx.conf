events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Upstream to local n8n service on the internal Docker network
    upstream n8n_backend {
        server n8n:5678;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 25M;

        # EXPOSE ONLY WEBHOOK PATHS TO THE PUBLIC TUNNEL
        location /webhook/ {
            proxy_pass http://n8n_backend/webhook/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location /webhook-test/ {
            proxy_pass http://n8n_backend/webhook-test/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # BLOCK ALL OTHER PATHS (Admin UI, credentials, workflows, REST API)
        location / {
            default_type text/plain;
            return 403 "Forbidden: Access restricted to authorized webhook endpoints.\n";
        }
    }
}
